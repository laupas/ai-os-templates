description: Microsoft 365 through Microsoft's Work IQ MCP server - mail, calendar, contacts and more, as Graph paths
config:
  type: http
  url: https://workiq.svc.cloud.microsoft/mcp
  oauth:
    authorization_endpoint: https://login.microsoftonline.com/${M365_TENANT_ID}/oauth2/v2.0/authorize
    token_endpoint: https://login.microsoftonline.com/${M365_TENANT_ID}/oauth2/v2.0/token
    client_id: ${M365_CLIENT_ID}
    client_secret: ${M365_CLIENT_SECRET}
    scopes:
    - api://workiq.svc.cloud.microsoft/WorkIQAgent.Ask
    - offline_access
enabled: true
sign_in: per_user
shared_fallback: false
store:
  title: Microsoft 365
  category: Microsoft
  version: "2.0.0"
  author: ai-os templates
  license: MIT
  homepage: https://learn.microsoft.com/en-us/microsoft-365-copilot/extensibility/work-iq/mcp/overview
  tags:
  - microsoft
  - mail
  - calendar
  - oauth
  notes: |
    Uses Microsoft's Work IQ MCP server, which reaches mail, calendar, files, chats,
    meetings and contacts in Microsoft 365. Every user signs in with their own work
    account on the Connectors page and sees only what that account can see.

    It needs an app registration in your Microsoft Entra tenant and Work IQ billing;
    set them up once:

    1. Your tenant must be enabled for Work IQ: its service principal (app id
       `fdcc1f02-fc51-4226-8753-f668596af7f7`) must exist. If it does not, sign-in
       fails with `AADSTS650052`; a tenant administrator follows Microsoft's
       *Enable your tenant for Work IQ*, or runs
       `az ad sp create --id fdcc1f02-fc51-4226-8753-f668596af7f7`.
    2. In the [Entra admin center](https://entra.microsoft.com/), **App registrations,
       New registration** (or the app you already use for single sign-on): single
       tenant, platform *Web*, with the redirect URI
       `https://<your ai-os address>/api/oauth/callback`
       (on your own machine: `http://localhost:8080/api/oauth/callback`).
    3. **API permissions, Add a permission, APIs my organization uses**: search
       `fdcc1f02-fc51-4226-8753-f668596af7f7`, delegated **WorkIQAgent.Ask**. Then
       **Grant admin consent**; it is required. No Microsoft Graph permissions are
       needed.
    4. **Certificates & secrets, New client secret**, and copy its *Value*.
    5. Work IQ is billed by use in Copilot Credits: in the Microsoft 365 admin center
       a Global or Billing Administrator activates billing and creates an
       identity-based spending policy for the service *Work IQ API for custom apps
       and agents* that covers the users who will sign in. Without it, Work IQ can
       refuse the connection although sign-in works.
    6. Paste the tenant id (Overview, *Directory (tenant) ID*), the client id
       (*Application (client) ID*) and the secret below.

    `WorkIQAgent.Ask` is not read-only: agents can also send mail and change
    calendar entries. Grant agents only the tools they need.
  variables:
  - variable: M365_TENANT_ID
    label: Entra tenant id
    hint: 'Entra admin center, the app registration, Overview: Directory (tenant) ID.'
    secret: false
    required: true
  - variable: M365_CLIENT_ID
    label: Entra client id
    hint: 'The app registration, Overview: Application (client) ID.'
    secret: false
    required: true
  - variable: M365_CLIENT_SECRET
    label: Entra client secret
    hint: 'The app registration, Certificates & secrets: the value of a client secret.'
    secret: true
    required: true
